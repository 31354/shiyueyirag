<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RAG Agent 聊天</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .container { width: 720px; height: 90vh; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 600;
    color: #333; display: flex; justify-content: space-between; align-items: center; }
  header .status { font-size: 12px; color: #888; font-weight: normal; }
  header .status.ok { color: #2a9d3f; }
  header .status.err { color: #d33; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: #f0f0f0; color: #222; border-bottom-left-radius: 4px; }
  .msg.bot.loading { color: #888; font-style: italic; }
  footer { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; background: #fafafa; }
  #input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; outline: none; font-family: inherit; }
  #input:focus { border-color: #007aff; }
  #send { padding: 10px 20px; background: #007aff; color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #send:disabled { background: #aaa; cursor: not-allowed; }
  #clear { padding: 6px 12px; background: transparent; color: #888;
    border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <span>RAG Agent 聊天</span>
    <span>
      <span class="status" id="status">检查中…</span>
      <button id="clear">清空</button>
    </span>
  </header>
  <div id="messages"></div>
  <footer>
    <input id="input" placeholder="输入问题，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</div>

<script>
const API_BASE = "http://localhost:8000";
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear");
const statusEl = document.getElementById("status");

let history = [];
let busy = false;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = "status " + (cls || "");
}

function appendMessage(role, text, loading) {
  const div = document.createElement("div");
  div.className = "msg " + role + (loading ? " loading" : "");
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function checkHealth() {
  try {
    const r = await fetch(API_BASE + "/health");
    if (!r.ok) throw new Error("HTTP " + r.status);
    setStatus("已连接", "ok");
  } catch (e) {
    setStatus("连接失败", "err");
  }
}

async function send() {
  const q = inputEl.value.trim();
  if (!q || busy) return;
  inputEl.value = "";
  busy = true;
  sendBtn.disabled = true;

  appendMessage("user", q);
  const loadingEl = appendMessage("bot", "思考中…", true);

  try {
    const resp = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ question: q, history: history }),
    });
    if (!resp.ok) {
      const txt = await resp.text();
      throw new Error("HTTP " + resp.status + ": " + txt);
    }
    const data = await resp.json();
    const answer = data.answer || "(空回答)";

    loadingEl.classList.remove("loading");
    loadingEl.textContent = answer;

    history.push({ role: "user", content: q });
    history.push({ role: "assistant", content: answer });
    if (history.length > 10) history = history.slice(-10);
  } catch (e) {
    loadingEl.classList.remove("loading");
    loadingEl.textContent = "请求失败：" + e.message;
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
clearBtn.addEventListener("click", () => {
  if (!confirm("清空当前对话？")) return;
  history = [];
  messagesEl.innerHTML = "";
});

checkHealth();
inputEl.focus();
</script>
</body>
</html>
